[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algoplay"
version = "1.0.0"
description = "Interactive Algorithm Visualizer & Learning Engine (Python Tkinter)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditi Phulre", email = "phulre.aditi@gmail.com" }
]
keywords = [
    "algorithm",
    "visualizer",
    "sorting",
    "searching",
    "tkinter",
    "education",
    "data-structures"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.scripts]
algoplay = "main:main"

[project.urls]
Homepage = "https://github.com/phulreaditi/AlgoPlay"
Repository = "https://github.com/phulreaditi/AlgoPlay.git"
Issues = "https://github.com/phulreaditi/AlgoPlay/issues"
